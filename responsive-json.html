<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta id="siteDescription" name="description" content="Current daily schedule information.">
  <meta id="themeColor" name="theme-color" content="#455a64">
  <title>Current Schedule</title>
  <style>
    :root{color-scheme:light;--accent:#455a64;--ink:#251f20;--muted:#695f61;--paper:#fff;--wash:#f6f2ef;--line:#e4dad6}
    *{box-sizing:border-box}
    body{margin:0;background:var(--wash);background:color-mix(in srgb,var(--accent) 8%,var(--paper));color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100% - 1.5rem,58rem);margin:auto;padding:clamp(1.25rem,4vw,3rem) 0}
    header{text-align:center;margin-bottom:1.25rem}
    h1{font-size:clamp(1.7rem,6vw,3rem);line-height:1.08;margin:0 0 .45rem}
    #day{color:var(--accent);font-size:clamp(1.15rem,4vw,1.7rem);font-weight:750}
    #clock{color:var(--muted);font-size:.95rem;margin-top:.2rem}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:1rem;box-shadow:0 .3rem 1rem #3e1c1810;padding:clamp(1rem,4vw,1.5rem)}
    .now{text-align:center}
    .eyebrow{color:var(--muted);font-size:.78rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
    #current{font-size:clamp(1.8rem,8vw,3.8rem);line-height:1.08;font-weight:800;margin:.25rem 0}
    #range{color:var(--muted)}
    .meter{height:.8rem;background:#e8e2df;border-radius:99rem;overflow:hidden;margin:1.2rem 0 .75rem}
    #bar{width:0;height:100%;background:var(--accent);border-radius:inherit;transition:width .5s linear}
    .facts{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1.2rem;text-align:left}
    .fact{background:var(--wash);border-radius:.75rem;padding:.85rem 1rem;min-width:0}
    .value{display:block;font-size:clamp(1.05rem,4vw,1.35rem);font-weight:750;overflow-wrap:anywhere;margin-top:.15rem}
    .schedule{margin-top:1rem}
    h2{font-size:1.2rem;margin:0 0 .75rem}
    ol{list-style:none;padding:0;margin:0;display:grid;gap:.35rem}
    li{display:grid;grid-template-columns:minmax(8.5rem,11rem) 1fr;gap:.7rem;padding:.6rem .7rem;border-radius:.55rem}
    li:nth-child(odd){background:var(--wash)}
    li.active{background:var(--accent);color:#fff;font-weight:750}
    .time{font-variant-numeric:tabular-nums;color:var(--muted)}
    li.active .time{color:inherit}
    footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:1rem}
    @media(max-width:32rem){.facts{grid-template-columns:1fr}li{grid-template-columns:1fr;gap:0}.time{font-size:.82rem}}
    @media(prefers-reduced-motion:reduce){#bar{transition:none}}
  </style>
</head>
<body>
<main>
  <header>
    <h1 id="siteTitle">Current Schedule</h1>
    <div id="day">Loading today’s schedule…</div>
    <div id="clock"></div>
  </header>

  <section class="card now" aria-live="polite">
    <div class="eyebrow" id="status">Right now</div>
    <div id="current">Loading…</div>
    <div id="range"></div>
    <div class="meter" role="progressbar" aria-label="Progress through the current block" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div>
    <div class="facts">
      <div class="fact"><span class="eyebrow">Time remaining</span><span class="value" id="remaining">—</span></div>
      <div class="fact"><span class="eyebrow">Up next</span><span class="value" id="next">—</span></div>
    </div>
  </section>

  <section class="card schedule">
    <h2>Today’s schedule</h2>
    <ol id="schedule"></ol>
  </section>

  <footer><div id="disclaimer"></div><div id="contact"></div><div id="dataVersion"></div><div id="revision"></div></footer>
</main>

<script>
let calendarData=null,preparedTypes=[],zoneFormatter=null;

const $=id=>document.getElementById(id);
let renderedDate='';

function findSchedule(key){
  for(const type of preparedTypes)if(type.dates.includes(key))return type;
  return null;
}
function validDate(value){
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
  const [year,month,day]=value.split('-').map(Number),date=new Date(Date.UTC(year,month-1,day));
  return date.getUTCFullYear()===year&&date.getUTCMonth()===month-1&&date.getUTCDate()===day;
}
function parseTime(value){
  const match=/^(\d{2}):(\d{2})$/.exec(value);
  if(!match)throw new Error(`Invalid time: ${value}`);
  const hour=Number(match[1]),minute=Number(match[2]);
  if(hour>23||minute>59)throw new Error(`Invalid time: ${value}`);
  return hour*60+minute;
}
function zonedNow(now){
  const parts=Object.fromEntries(zoneFormatter.formatToParts(now).filter(part=>part.type!=='literal').map(part=>[part.type,part.value]));
  return {key:`${parts.year}-${parts.month}-${parts.day}`,minute:Number(parts.hour)*60+Number(parts.minute)+Number(parts.second)/60};
}
function timeLabel(minutes){
  const h=Math.floor(minutes/60),m=minutes%60;
  return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;
}
function duration(seconds){
  seconds=Math.max(0,Math.ceil(seconds));
  const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;
}
function renderSchedule(info,active=-1){
  const list=$('schedule');
  if(!info){list.innerHTML='<li>No schedule is listed for this date.</li>';return}
  if(info.allDay){list.innerHTML=`<li class="active"><span>All day</span><span>${info.allDay}</span></li>`;return}
  list.innerHTML=info.blocks.slice(0,-1).map(([start,name],i)=>`<li${i===active?' class="active"':''}><span class="time">${timeLabel(start)}–${timeLabel(info.blocks[i+1][0])}</span><span>${name}</span></li>`).join('')+`<li><span class="time">${timeLabel(info.blocks.at(-1)[0])}</span><span>${info.blocks.at(-1)[1]}</span></li>`;
}
function update(){
  const now=new Date(),schoolTime=zonedNow(now),key=schoolTime.key,minute=schoolTime.minute,info=findSchedule(key);
  $('clock').textContent=now.toLocaleString('en-US',{timeZone:calendarData.timezone,weekday:'long',month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'});
  $('day').textContent=info?info.name:'Schedule unavailable';
  document.documentElement.style.setProperty('--accent',info?.color||calendarData.site.defaultColor);
  if(!info){
    $('status').textContent='Today';$('current').textContent='No schedule listed';$('range').textContent='Please check the official calendar.';$('remaining').textContent='—';$('next').textContent='—';setProgress(0);
    if(renderedDate!==key){renderSchedule(null);renderedDate=key}return;
  }
  if(info.allDay){
    $('status').textContent='Today';$('current').textContent=info.allDay;$('range').textContent='All day';$('remaining').textContent='—';$('next').textContent='—';setProgress(100);
    if(renderedDate!==key){renderSchedule(info);renderedDate=key}return;
  }
  const b=info.blocks;
  let active=-1;
  for(let i=0;i<b.length-1;i++)if(minute>=b[i][0]&&minute<b[i+1][0])active=i;
  if(minute<b[0][0]){
    $('status').textContent='Before school';$('current').textContent='School has not started';$('range').textContent=`Begins at ${timeLabel(b[0][0])}`;$('remaining').textContent=duration((b[0][0]-minute)*60);$('next').textContent=b[0][1];setProgress(0);
  }else if(minute>=b.at(-1)[0]){
    $('status').textContent='For today';$('current').textContent=b.at(-1)[1];$('range').textContent=`Since ${timeLabel(b.at(-1)[0])}`;$('remaining').textContent='—';$('next').textContent='—';setProgress(100);
  }else{
    const start=b[active][0],end=b[active+1][0];
    $('status').textContent='Right now';$('current').textContent=b[active][1];$('range').textContent=`${timeLabel(start)}–${timeLabel(end)}`;$('remaining').textContent=duration((end-minute)*60);$('next').textContent=b[active+1][1];setProgress((minute-start)/(end-start)*100);
  }
  const renderKey=`${key}:${active}`;
  if(renderedDate!==renderKey){renderSchedule(info,active);renderedDate=renderKey}
}
function setProgress(value){const n=Math.max(0,Math.min(100,value));$('bar').style.width=`${n}%`;$('bar').parentElement.setAttribute('aria-valuenow',Math.round(n))}
function validateCalendar(data){
  if(data?.schemaVersion!==3||!data.site||!Array.isArray(data.dayTypes)||!data.schedules)throw new Error('Unsupported schedule data');
  if(!data.site.title||!data.site.schoolName||!data.site.defaultColor||!data.timezone)throw new Error('Missing site information');
  const assignedDates=new Map();
  for(const type of data.dayTypes){
    if(!type.label||!type.color||!Array.isArray(type.dates))throw new Error(`Invalid day type: ${type.label||'unknown'}`);
    for(const date of type.dates){
      if(!validDate(date))throw new Error(`Invalid date: ${date}`);
      if(assignedDates.has(date))throw new Error(`${date} appears in both ${assignedDates.get(date)} and ${type.label}`);
      assignedDates.set(date,type.label);
    }
    if(!type.allDay){
      const schedule=data.schedules[type.schedule];
      if(!schedule||!Array.isArray(schedule.blocks)||schedule.blocks.length<2)throw new Error(`Missing schedule: ${type.schedule}`);
      let previous=-1;
      for(const block of schedule.blocks){
        if(!block.label)throw new Error(`Missing block label in ${type.schedule}`);
        const start=parseTime(block.start);
        if(start<=previous)throw new Error(`Times are not ordered in ${type.schedule}`);
        previous=start;
      }
    }
  }
  return data;
}
function prepareCalendar(data){
  preparedTypes=data.dayTypes.map(type=>{
    const prepared={name:type.label,color:type.color,dates:type.dates};
    if(type.allDay)prepared.allDay=type.allDay;
    else prepared.blocks=data.schedules[type.schedule].blocks.map(block=>[parseTime(block.start),block.label]);
    return prepared;
  });
}
function applySite(data){
  document.title=data.site.title;
  $('siteTitle').textContent=data.site.title;
  $('siteDescription').setAttribute('content',data.site.description||data.site.title);
  $('themeColor').setAttribute('content',data.site.defaultColor);
  $('disclaimer').textContent=data.site.disclaimer||'';
  $('contact').textContent=data.site.contact||'';
  $('dataVersion').textContent=data.dataVersion?`Data version: ${data.dataVersion}`:'';
  $('revision').textContent=data.revisionNote||'';
}
async function loadCalendar(){
  try{
    const requestedData=new URLSearchParams(location.search).get('data');
    const isLocal=location.hostname==='localhost'||location.hostname==='127.0.0.1';
    const dataFile=isLocal&&requestedData&&/^[A-Za-z0-9._-]+\.json$/.test(requestedData)?requestedData:'schedule-data.json';
    const response=await fetch(`./${dataFile}`,{cache:'no-cache'});
    if(!response.ok)throw new Error(`Schedule request failed: ${response.status}`);
    calendarData=validateCalendar(await response.json());
    prepareCalendar(calendarData);
    applySite(calendarData);
    zoneFormatter=new Intl.DateTimeFormat('en-US',{timeZone:calendarData.timezone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
    update();
    setInterval(update,1000);
  }catch(error){
    const now=new Date();
    $('clock').textContent=now.toLocaleString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
    $('day').textContent='Schedule unavailable';
    $('current').textContent='Schedule data could not be loaded';
    $('range').textContent='Please try refreshing the page.';
    $('remaining').textContent='—';
    $('next').textContent='—';
    $('schedule').innerHTML='<li>The schedule data file is unavailable or invalid.</li>';
    console.error(error);
  }
}
loadCalendar();
</script>
</body>
</html>
